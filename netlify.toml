[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# Cron jobs (replican los crons de vercel.json en Netlify)
# Reach these Next.js route handlers via GET
[[cron]]
  path = "/api/automation"
  schedule = "0 9 * * *"

[[cron]]
  path = "/api/invoices/run-monthly"
  schedule = "0 5 1 * *"
